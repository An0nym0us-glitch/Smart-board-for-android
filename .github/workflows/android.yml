name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Check APK is launchable
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$AAPT" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|leanback-launchable-activity|application:)"
            "$AAPT" dump badging "$apk" | grep -q "^launchable-activity: name='com.classboard.app.MainActivity'" \
              || { echo "::error::$apk has no launcher activity"; exit 1; }
            if "$AAPT" dump badging "$apk" | grep -q "testOnly"; then echo "::error::$apk is test-only"; exit 1; fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassBoard-release-apk
          path: app/build/outputs/apk/release/*.apk

  smoke-test:
    name: Launch on emulator
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: ClassBoard-debug-apk
          path: apk

      - name: Run app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh apk/app-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots

  publish:
    name: Publish installable APK
    runs-on: ubuntu-24.04
    needs: [build, smoke-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClassBoard-release-apk
          path: apk

      - name: Publish ClassBoard.apk to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk ClassBoard.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ClassBoard.apk \
            --target "$GITHUB_SHA" \
            --title "ClassBoard for Android (latest build)" \
            --notes "Download ClassBoard.apk on your Android tablet or phone, open it, and allow \"Install unknown apps\" when asked. Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
